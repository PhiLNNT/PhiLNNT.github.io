<section class="visitor-globe-card">
  <div class="visitor-globe__header">
    <div>
      <p class="visitor-globe__eyebrow">Website traffic</p>
      <h2 class="visitor-globe__title">Visitors around the world</h2>
      <p class="visitor-globe__period" id="visitor-period">Loading…</p>
    </div>

    <div class="visitor-globe__stats">
      <div class="visitor-stat">
        <span id="visitor-pageviews">--</span>
        <small>Pageviews</small>
      </div>
      <div class="visitor-stat">
        <span id="visitor-visitors">--</span>
        <small>Visitors</small>
      </div>
      <div class="visitor-stat">
        <span id="visitor-countries">--</span>
        <small>Countries</small>
      </div>
    </div>
  </div>

  <div class="visitor-globe__content">
    <div class="visitor-globe__globe-wrap">
      <div id="visitor-globe"></div>
    </div>

    <aside class="visitor-globe__panel">
      <h3>Top locations</h3>
      <ul id="visitor-top-locations" class="visitor-globe__list"></ul>

      <div class="visitor-globe__legend">
        <span class="dot dot--small"></span> lower traffic
        <span class="dot dot--large"></span> higher traffic
      </div>

      <p class="visitor-globe__note">
        Approximate locations, aggregated for display.
      </p>
    </aside>
  </div>
</section>

<script src="https://unpkg.com/globe.gl"></script>
<script>
(function () {
  const root = document.getElementById("visitor-globe");
  if (!root || root.dataset.loaded === "true") return;
  root.dataset.loaded = "true";

  const dataUrl = "{{ '/assets/data/visitors.json' | relative_url }}";

  function numberFmt(n) {
    return new Intl.NumberFormat().format(n || 0);
  }

  function makeTopList(items) {
    const list = document.getElementById("visitor-top-locations");
    list.innerHTML = "";

    items
      .slice()
      .sort((a, b) => b.views - a.views)
      .slice(0, 6)
      .forEach((item, idx) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <span class="rank">${idx + 1}</span>
          <div class="meta">
            <strong>${item.city}, ${item.country}</strong>
            <small>${numberFmt(item.views)} views</small>
          </div>
        `;
        list.appendChild(li);
      });
  }

  fetch(dataUrl)
    .then((res) => res.json())
    .then((data) => {
      document.getElementById("visitor-period").textContent = data.period || "Last 30 days";
      document.getElementById("visitor-pageviews").textContent = numberFmt(data.pageviews);
      document.getElementById("visitor-visitors").textContent = numberFmt(data.visitors);
      document.getElementById("visitor-countries").textContent = numberFmt(data.countries);

      makeTopList(data.locations || []);

      const points = (data.locations || []).map((d) => ({
        lat: d.lat,
        lng: d.lng,
        label: `
          <div style="padding:6px 8px;">
            <strong>${d.city}, ${d.country}</strong><br/>
            ${numberFmt(d.views)} views
          </div>
        `,
        size: Math.max(0.18, Math.min(0.65, Math.sqrt(d.views) / 20)),
        color: d.color || "#69e3ff"
      }));

      const getSize = () => {
        const w = root.clientWidth || 700;
        return {
          width: w,
          height: Math.max(320, Math.min(560, Math.round(w * 0.78)))
        };
      };

      const size = getSize();

      const globe = Globe()(root)
        .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-night.jpg")
        .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
        .backgroundColor("rgba(0,0,0,0)")
        .showAtmosphere(true)
        .atmosphereColor("#8be9ff")
        .atmosphereAltitude(0.16)
        .pointsData(points)
        .pointLat("lat")
        .pointLng("lng")
        .pointAltitude("size")
        .pointRadius("size")
        .pointColor("color")
        .pointLabel("label")
        .width(size.width)
        .height(size.height);

      globe.pointOfView({ lat: 20, lng: 25, altitude: 2.1 }, 0);

      const controls = globe.controls();
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.45;
      controls.enablePan = false;
      controls.minDistance = 180;
      controls.maxDistance = 350;

      let resizeTimer = null;
      window.addEventListener(
        "resize",
        () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            const s = getSize();
            globe.width(s.width).height(s.height);
          }, 120);
        },
        { passive: true }
      );
    })
    .catch((err) => {
      root.innerHTML = "<p style='color:#cfe9ff;'>Could not load visitor map data.</p>";
      console.error(err);
    });
})();
</script>
